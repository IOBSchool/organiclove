<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>あなたは、オーガニックをどこに生かしたいですか？｜無料の動画授業｜ドイツIOBオーガニックスクール</title>
<meta name="description" content="レムケなつこの無料の動画授業。最初の1本は2分41秒、全6パート約32分。食や暮らしに生かしたい方も、自分の仕事に生かしたい方も、同じ授業を受け取れます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f7ef;--surface:#fff;--ink:#553727;--ink-soft:#85634b;--ink-faint:#a68b73;--accent:#f26b3b;--border:rgba(85,55,39,.16)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}
.nw{white-space:nowrap}
.nb{display:inline-block}
header.top{padding:16px 0 0}
header.top img{display:block;width:104px;height:auto}
.chip{display:inline-flex;align-items:center;gap:7px;margin:18px 0 0;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.05em;padding:6px 14px;border-radius:999px}
.chip svg{width:12px;height:12px}
h1{margin:26px 0 22px;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:clamp(25px,7.3vw,33px);line-height:1.5;letter-spacing:.01em}
.sub{margin:0 0 6px;font-size:15px;line-height:1.85;color:var(--ink)}
.facts{margin:0 0 24px;font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em}
.pick{margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--accent);letter-spacing:.05em}
.choices{display:grid;gap:14px}
.choice{display:block;text-decoration:none;color:inherit;background:var(--surface);border-radius:16px;border:2px solid var(--accent);box-shadow:0 3px 16px rgba(85,55,39,.12);padding:16px 18px 18px;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.choice:active{transform:scale(.99)}
.choice:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.who{display:inline-block;margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:1px}
.voice{display:block;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:clamp(17px,5vw,20px);line-height:1.65;margin:0 0 14px}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;letter-spacing:.03em;line-height:1.5;padding:14px 10px;border-radius:10px}
.same{margin:18px 0 0;font-size:13.5px;line-height:1.9;color:var(--ink)}
.small{margin:18px 0 0;text-align:center;font-size:12.5px;line-height:1.9;color:var(--ink-soft)}
.teacher{display:flex;gap:14px;align-items:center;margin:30px 0 0;padding:16px;background:var(--surface);border-radius:14px;border:1px solid var(--border)}
.teacher img{flex:0 0 64px;width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:30% 20%}
.teacher p{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink-soft)}
.teacher b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
footer{padding:34px 0 30px;font-size:11.5px;color:var(--ink-faint);line-height:1.9}
footer a{color:var(--ink-faint);margin-right:14px}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><img src="../images/logo_orange.png" alt="ドイツIOBオーガニックスクール"></div></header>
<main>
  <div class="wrap">
    <h1>あなたは、<br>オーガニックを<br>どこに生かしたいですか？</h1>
    <div class="choices">
      <a class="choice" id="go-life" href="../organic-life/">
        <span class="voice">自分や家族の食べものを、<span class="nb">納得して選びたい。</span></span>
        <span class="btn">食や暮らしに生かす →</span>
      </a>
      <a class="choice" id="go-pro" href="../">
        <span class="voice">お客さまに、オーガニックの価値を<span class="nb">自分の言葉で伝えたい。</span></span>
        <span class="btn">自分の仕事に生かす →</span>
      </a>
    </div>
    <p class="small">無料動画授業｜最初の1本は2分41秒・全6パート約32分</p>
  </div>
</main>
<footer>
  <div class="wrap">
    <a href="https://iob.bio/">ドイツIOBオーガニックスクール</a><a href="https://iob.bio/policy.html">プライバシーポリシー</a>
    <div id="cr"></div>
  </div>
</footer>
<script>
/* 行き先は今のハブと同じ。流入元(?src=)は引き継ぎ、選んだ道を path=life|pro で付ける */
var LIFE_URL = "../organic-life/";
var PRO_URL  = "../";
(function(){
  var src = "";
  try {
    var v = new URLSearchParams(location.search).get("src") || "";
    if (/^[A-Za-z0-9_-]{1,30}$/.test(v)) src = v;
  } catch(e) {}
  function href(base, path){
    var q = "path=" + path + (src ? "&src=" + encodeURIComponent(src) : "");
    return base + (base.indexOf("?") > -1 ? "&" : "?") + q;
  }
  document.getElementById("go-life").href = href(LIFE_URL, "life");
  document.getElementById("go-pro").href  = href(PRO_URL, "pro");
  document.getElementById("cr").textContent = "© " + new Date().getFullYear() + " Institut für Organic Business GmbH. All Rights Reserved.";
})();
</script>
<script src="../track.js" data-page="hub" defer></script>
</body>
</html>
