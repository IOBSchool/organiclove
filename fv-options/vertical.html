<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>organiclove 縦書きFV 3パターン比較｜もどかしさ→卒業の見せ方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f26b3b;
    --accent-l:#ff9a6b;
    --ink:#2b231d;
    --bg:#f3efe9;
    --card:#fffdfa;
    --border:#e5ddd1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%}
  .head{max-width:980px;margin:0 auto;padding:30px 18px 6px}
  .head h1{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:21px;margin:0 0 8px;letter-spacing:.02em}
  .head p{margin:0;font-size:13.5px;color:#6b6054}
  .head .note{margin-top:10px;font-size:12.5px;color:#8a7f72}
  .grid{max-width:1120px;margin:0 auto;padding:18px 16px 60px;
    display:grid;gap:30px 22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .card{margin:0}
  .cap{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 3px;letter-spacing:.01em}
  .cap .n{color:var(--accent);margin-right:6px}
  .desc{font-size:12px;color:#8a7f72;margin:0 0 10px;min-height:3.1em}

  /* ---- phone mockup（共通・縦パターンA） ---- */
  .ph{position:relative;width:100%;aspect-ratio:320/600;overflow:hidden;color:#fff;
    background:#6d7a5c url(../images/hero_allgaeu.jpg) 44% center/cover;
    border-radius:18px;box-shadow:0 12px 30px rgba(60,42,28,.20)}
  /* 左に影をのせて縦書きの可読性を確保（人物は右に逃がす） */
  .ph::after{content:"";position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(90deg,rgba(0,0,0,.58) 0%,rgba(0,0,0,.34) 34%,rgba(0,0,0,.06) 56%,rgba(0,0,0,0) 72%),
      linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 70%,rgba(0,0,0,.42) 100%)}
  .ph>*{position:relative;z-index:2}
  .logo{position:absolute;left:16px;top:15px;width:94px;filter:brightness(0) invert(1);opacity:.95}

  /* 縦書き本文：左に配置、右→左に catch→sub（素直な縦組み） */
  .vtext{position:absolute;left:14px;top:66px;z-index:2;
    writing-mode:vertical-rl}
  .catch{margin:0;font-family:"Zen Old Mincho",serif;font-weight:700;
    font-size:23px;line-height:1.92;letter-spacing:.06em;
    text-shadow:0 2px 14px rgba(0,0,0,.55)}
  .sub{margin:0;font-family:"Zen Old Mincho",serif;
    text-shadow:0 2px 12px rgba(0,0,0,.5)}

  /* 呼びかけ：右下に小さくゴシック */
  .eyebrow{position:absolute;right:15px;bottom:18px;z-index:2;margin:0;text-align:right;
    font-size:11px;line-height:1.85;max-width:17em;
    text-shadow:0 1px 8px rgba(0,0,0,.6);font-weight:500}
  .eyebrow b{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:12.5px;white-space:nowrap}

  /* ===== V1 標準：catchの続きとして自然に読ませる ===== */
  .v1 .sub{font-size:19px;font-weight:600;line-height:1.95;letter-spacing:.05em;margin-right:.35em}

  /* ===== V2 控えめ：小さく静かに。余韻の囁き ===== */
  .v2 .sub{font-size:14.5px;font-weight:400;line-height:2.05;letter-spacing:.09em;
    opacity:.9;margin-right:.6em}

  /* ===== V3 やや目立つ：サブを一回り大きく＋「卒業できます」をアクセント ===== */
  .v3 .sub{font-size:21px;font-weight:700;line-height:1.9;letter-spacing:.05em;margin-right:.3em}
  .v3 .sub .hl{color:var(--accent-l);text-shadow:0 2px 12px rgba(0,0,0,.6)}
</style>
</head>
<body>

<div class="head">
  <h1>organiclove 縦書きFV ― 3パターン比較</h1>
  <p>なつこさんお気に入りの<b>縦書きスタイル</b>で、トップの長文コピーをそのまま流し込みました。キャッチ「今の自分じゃ〜伝え切れない…」はすべて共通で、変えたのは<b>サブ「そんなもどかしさ、ここで卒業できます。」の目立ち具合</b>だけ（標準／控えめ／やや目立つ）です。</p>
  <p class="note">※スマホ縦長での見え方のモック。文字はすべて実テキスト（画像ではない）。右→左へ読む自然な縦組みで、本文は左、人物は右に配置しています。採用が決まったら、そのままv3のヘッダーに反映します。</p>
</div>

<div class="grid">

  <figure class="card">
    <p class="cap"><span class="n">V1</span>標準（続きとして自然に）</p>
    <p class="desc">サブをキャッチの流れのまま、少しだけ小さく。問いかけから答えへ、ひと息で読み切れる。</p>
    <div class="ph v1">
      <img class="logo" src="../images/logo_orange.png" alt="IOB">
      <div class="vtext">
        <h3 class="catch">「今の自分じゃ<br>オーガニックの<br>本当の良さを<br>伝え切れない…」</h3>
        <p class="sub">そんなもどかしさ、<br>ここで卒業できます。</p>
      </div>
      <p class="eyebrow"><b>「オーガニックが、あたりまえ。」</b><br>な社会にしたいと、日々がんばっているあなたへ</p>
    </div>
  </figure>

  <figure class="card">
    <p class="cap"><span class="n">V2</span>控えめ（静かな余韻）</p>
    <p class="desc">サブは小さく薄く、囁くように。キャッチの余白を生かし、上品に締める。</p>
    <div class="ph v2">
      <img class="logo" src="../images/logo_orange.png" alt="IOB">
      <div class="vtext">
        <h3 class="catch">「今の自分じゃ<br>オーガニックの<br>本当の良さを<br>伝え切れない…」</h3>
        <p class="sub">そんなもどかしさ、<br>ここで卒業できます。</p>
      </div>
      <p class="eyebrow"><b>「オーガニックが、あたりまえ。」</b><br>な社会にしたいと、日々がんばっているあなたへ</p>
    </div>
  </figure>

  <figure class="card">
    <p class="cap"><span class="n">V3</span>やや目立つ（希望を一点強調）</p>
    <p class="desc">サブを一回り大きく、「卒業できます」だけオレンジで。前向きな約束をしっかり立たせる。</p>
    <div class="ph v3">
      <img class="logo" src="../images/logo_orange.png" alt="IOB">
      <div class="vtext">
        <h3 class="catch">「今の自分じゃ<br>オーガニックの<br>本当の良さを<br>伝え切れない…」</h3>
        <p class="sub">そんなもどかしさ、<br>ここで<span class="hl">卒業できます。</span></p>
      </div>
      <p class="eyebrow"><b>「オーガニックが、あたりまえ。」</b><br>な社会にしたいと、日々がんばっているあなたへ</p>
    </div>
  </figure>

</div>
</body>
</html>
